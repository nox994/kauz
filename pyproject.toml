[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kauz"
version = "0.3.0"
description = "The friendly security check for your Linux PC"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "nox994" }]
classifiers = ["Operating System :: POSIX :: Linux", "Topic :: Security"]

[project.urls]
Homepage = "https://github.com/nox994/kauz"

[project.optional-dependencies]
gui = ["PySide6>=6.5"]

[project.scripts]
kauz = "kauz.cli:main"

[project.gui-scripts]
kauz-gui = "kauz.gui:main"

[tool.setuptools.packages.find]
include = ["kauz*"]
